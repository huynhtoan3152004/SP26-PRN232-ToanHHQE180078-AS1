services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql2022
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Zzdigimon@315"
    ports:
      - "1433:1433"
    volumes:
      - docker_sqlserver_data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Zzdigimon@315" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  docker_sqlserver_data:
